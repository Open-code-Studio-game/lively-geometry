name: Build macOS (.app)

# 触发：推送到 main 自动构建，也可在 Actions 页面手动 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

# ============================ 必看：GitHub Secrets ============================
# 仓库 Settings → Secrets and variables → Actions 里必须添加：
#   UNITY_LICENSE   你的 Unity 许可证文件(.ulf)的全部内容（Personal 版必填）
#   UNITY_EMAIL     你的 Unity 账号邮箱
#   UNITY_PASSWORD  你的 Unity 账号密码
#   UNITY_SERIAL    仅 Pro/Plus 需要；Personal 版留空即可（有了 UNITY_LICENSE 就够）
#
# 没有 UNITY_LICENSE 的话构建会直接失败（Personal 版不能只靠邮箱密码激活）。
# 拿 license 文件的方法见我给你的说明：本地找 Unity_lic.ulf，或走手动激活流程。
# ============================================================================

jobs:
  build-osx:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-OSX-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-OSX-

      - name: Build Unity project (StandaloneOSX)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneOSX
          unityVersion: 6000.5.8f1
          buildsPath: build
          versioning: None

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneOSX
          path: build/StandaloneOSX
          retention-days: 14

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Win-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Win-
      - name: Build Unity project (StandaloneWindows64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.5.8f1
          buildsPath: build
          versioning: None
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneWindows64
          path: build/StandaloneWindows64
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Linux-
      - name: Build Unity project (StandaloneLinux64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: 6000.5.8f1
          buildsPath: build
          versioning: None
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneLinux64
          path: build/StandaloneLinux64
          retention-days: 14
